services:
  forwarder:
    build:
      context: .
      args:
        VERSION: ${VERSION:-local}
    # docker compose pull 取预构建镜像，docker compose build 从源码构建到同一个标签
    image: ${IMAGE:-ghcr.io/henryxiaoyang/tg-wechat-forwarder:latest}
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      # The published port and the image healthcheck both assume 8080 inside the
      # container, so pin it here and let .env's LISTEN_ADDR apply to direct runs.
      LISTEN_ADDR: ":8080"
    ports:
      # Loopback by default: the panel speaks plain HTTP and has no TLS of its own.
      # Put a reverse proxy in front, or set BIND_ADDR=0.0.0.0 to expose it as is.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
